name: oral_record_agent
description: 구술기록 지식그래프 에이전트 v4.0
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 클라이언트
  dio: ^5.4.0

  # 상태 관리
  flutter_riverpod: ^2.4.0

  # 라우팅
  go_router: ^12.0.0

  # 그래프 시각화
  graphview: ^1.2.0

  # 로컬 설정 저장 (서버 IP 등)
  shared_preferences: ^2.2.0

  # 아이콘
  flutter_svg: ^2.0.0

  # 색상 유틸
  flex_color_scheme: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
