name: oral_record_agent
description: Oral Record Agent v4.0 — Ontology Knowledge Graph
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP 클라이언트
  dio: ^5.4.0

  # 상태 관리
  flutter_riverpod: ^2.4.0

  # 라우팅
  go_router: ^12.0.0

  # 그래프 시각화
  graphview: ^1.2.0

  # 로컬 설정 저장 (서버 IP 등)
  shared_preferences: ^2.2.0

  # 아이콘
  flutter_svg: ^2.0.0

  # 색상 유틸
  flex_color_scheme: ^7.3.0

  # 폰트
  google_fonts: ^6.2.1

  # 로딩 shimmer
  shimmer: ^3.0.0

  # 파일 선택
  file_picker: ^8.0.0
  flutter_colorpicker: ^1.1.0
  screenshot: ^3.0.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/malgun.ttf
