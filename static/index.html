<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구술기록 지식그래프 v4.0</title>

  <!-- React 18 (cdnjs) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.min.js"></script>

  <!-- Babel standalone (cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- D3.js (cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 헤더 */
    #header {
      background: #12122a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 48px;
      flex-shrink: 0;
    }
    #header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #a0b4d6;
      margin-right: 32px;
      white-space: nowrap;
    }

    /* 탭 */
    .tab {
      padding: 0 18px;
      height: 48px;
      line-height: 48px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .tab:hover  { color: #ccc; }
    .tab.active { color: #a0c4ff; border-bottom-color: #4a6fa5; }

    /* 콘텐츠 영역 */
    #content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 로딩 */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>구술기록 지식그래프 v4.0</h1>
  <div class="tab active" id="tab-ontology"  onclick="switchTab('ontology')">온톨로지 관리</div>
  <div class="tab"        id="tab-triple"    onclick="switchTab('triple')">트리플 관리</div>
  <div class="tab"        id="tab-graph"     onclick="switchTab('graph')">지식그래프</div>
</div>

<div id="content">
  <div id="loading">로딩 중...</div>
</div>

<!-- 컴포넌트 로드 (type="text/babel") -->
<script type="text/babel" src="/static/OntologyManager.jsx"></script>
<script type="text/babel" src="/static/TripleManager.jsx"></script>
<script type="text/babel" src="/static/KnowledgeGraph.jsx"></script>

<!-- JSX 포함 블록: COMPONENTS + renderTab 정의 후 window._renderTab 으로 노출 -->
<script type="text/babel">
  const COMPONENTS = {
    ontology: () => <OntologyManager />,
    triple:   () => <TripleManager />,
    graph:    () => <KnowledgeGraph />,
  };

  const root = ReactDOM.createRoot(document.getElementById("content"));

  window._renderTab = function(tab) {
    ["ontology", "triple", "graph"].forEach(t => {
      document.getElementById(`tab-${t}`).className = "tab" + (t === tab ? " active" : "");
    });
    root.render(
      <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
        {COMPONENTS[tab]()}
      </div>
    );
  };

  // 초기 렌더
  window._renderTab("ontology");
</script>

<!-- JSX 없는 순수 JS: onclick에서 호출되는 switchTab을 전역으로 노출 -->
<script type="text/javascript">
  function switchTab(tab) {
    if (window._renderTab) window._renderTab(tab);
  }
</script>

</body>
</html>
